name: Enterprise Server Candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Enterprise server version. This branch only accepts 1.9.13.'
        required: true
        type: string
        default: '1.9.13'

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: enterprise-server-candidate-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22.23.1'
  NPM_VERSION: '11.13.0'
  ELECTRON_VERSION: '43.2.0'
  SQLCIPHER_SOURCE_REVISION: e2a6040f2ae5cfff2b3e08eb3320007d93cdf3fc
  REVIEWED_RELEASE_SOURCE: 82b5e0c101a44358efbb900b0c2be62455c2412b
  ENTERPRISE_PACKAGE_BUILDER_SHA256: c52158ef3025b0bd6d6cdd1dab429111d0c781411f1448647c74238d19f0515c
  ENTERPRISE_RUNTIME_DEPS_SHA256: 6218482a35cc049147020b0d7ef3933fac9a147c44aab0905b26629573d64569
  ENTERPRISE_UPGRADER_SHA256: 561432a5504a3bc506ea94b9b32d468989fa4de4a50f3f0d022b9fb2e0ea0482
  ENTERPRISE_RELEASE_VERIFIER_SHA256: 514c385c6b492a2e974f49e31b09ec2fd9c8fb7996f91431744cf3a9be7560dc
  SQLCIPHER_NATIVE_WORKFLOW_SHA256: 25f70e506ab855f2a3f5cde357e3a01ab95118c1675c78e9073b9053ac846d8a

jobs:
  sqlcipher-native:
    name: Build verified SQLCipher native matrix
    uses: ./.github/workflows/sqlcipher-native.yml

  build-enterprise-candidate:
    name: Test and build unsigned enterprise candidate
    needs: sqlcipher-native
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate immutable release identity
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.version }}" = '1.9.13'
          test "$(node -p "require('./package.json').version")" = '1.9.13'
          test "$(node -p "require('./packages/desktop/package.json').version")" = '1.9.13'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git cat-file -e "${REVIEWED_RELEASE_SOURCE}^{commit}"
          git merge-base --is-ancestor "$REVIEWED_RELEASE_SOURCE" "$GITHUB_SHA"
          test "$(sha256sum scripts/build-enterprise-oneclick.mjs | awk '{print $1}')" = \
            "$ENTERPRISE_PACKAGE_BUILDER_SHA256"
          test "$(sha256sum scripts/enterprise-runtime-dependencies.mjs | awk '{print $1}')" = \
            "$ENTERPRISE_RUNTIME_DEPS_SHA256"
          test "$(sha256sum deployment/enterprise-oneclick/upgrade.sh | awk '{print $1}')" = \
            "$ENTERPRISE_UPGRADER_SHA256"
          test "$(sha256sum deployment/enterprise-oneclick/tools/verify-release.mjs | awk '{print $1}')" = \
            "$ENTERPRISE_RELEASE_VERIFIER_SHA256"
          test "$(sha256sum .github/workflows/sqlcipher-native.yml | awk '{print $1}')" = \
            "$SQLCIPHER_NATIVE_WORKFLOW_SHA256"
          git diff --quiet "$REVIEWED_RELEASE_SOURCE" "$GITHUB_SHA" -- \
            package.json package-lock.json tsconfig.json \
            packages/server \
            packages/core/package.json \
            packages/core/tsconfig.json \
            packages/core/src/services/aliyunSmsSender.ts \
            native/sqlcipher-node \
            scripts/build_package.js \
            scripts/copy_files.js \
            scripts/verify-enterprise-package-signature.mjs \
            scripts/verify-sqlcipher-native-assets.mjs
          git diff --quiet "$REVIEWED_RELEASE_SOURCE" "$GITHUB_SHA" -- \
            deployment/enterprise-oneclick \
            ':(exclude)deployment/enterprise-oneclick/upgrade.sh' \
            ':(exclude)deployment/enterprise-oneclick/tools/verify-release.mjs'
          while IFS= read -r changed; do
            case "$changed" in
              .github/workflows/release.yml | \
              .github/workflows/deploy-server.yml | \
              .github/workflows/sqlcipher-native.yml | \
              scripts/build-enterprise-oneclick.mjs | \
              scripts/enterprise-runtime-dependencies.mjs | \
              deployment/enterprise-oneclick/upgrade.sh | \
              deployment/enterprise-oneclick/tools/verify-release.mjs | \
              scripts/sign-enterprise-package.mjs | \
              scripts/validate-server-integration-baseline.mjs | \
              scripts/tests/sign-enterprise-package.test.js | \
              scripts/tests/sqlcipher-native-assets.test.js | \
              scripts/tests/enterprise-oneclick-installer.test.js | \
              scripts/tests/enterprise-deploy-workflow.test.js | \
              scripts/tests/enterprise-candidate-workflow.test.js | \
              scripts/tests/enterprise-runtime-dependencies.test.js) ;;
              *) echo "unexpected change beyond reviewed V1.9.13 source: $changed" >&2; exit 4 ;;
            esac
          done < <(git diff --name-only "$REVIEWED_RELEASE_SOURCE" "$GITHUB_SHA")

      - name: Pin npm lockfile resolver
        shell: bash
        run: |
          set -euo pipefail
          npm install --global "npm@${NPM_VERSION}" --ignore-scripts
          test "$(npm --version)" = "$NPM_VERSION"

      - name: Install dependencies
        run: npm ci
        env:
          PYTHON: python3.12
          GITHUB_TOKEN: ${{ github.token }}

      - name: Download verified enterprise Node.js SQLCipher matrix
        uses: actions/download-artifact@v7
        with:
          name: sqlcipher-node-native-matrix
          path: native/sqlcipher-node

      - name: Download verified SQLCipher native matrix
        uses: actions/download-artifact@v7
        with:
          name: sqlcipher-native-matrix
          path: native/sqlcipher

      - name: Verify SQLCipher provenance before packaging
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/verify-sqlcipher-native-assets.mjs \
            --root native/sqlcipher \
            --expected-build-commit "$GITHUB_SHA" \
            --expected-source-revision "$SQLCIPHER_SOURCE_REVISION" \
            --expected-runtime-version "$ELECTRON_VERSION" \
            --require-matrix-manifest
          while IFS= read -r -d '' binding; do
            gh attestation verify "$binding" --repo "$GITHUB_REPOSITORY"
          done < <(find native/sqlcipher -type f -name better_sqlite3.node -print0)
          gh attestation verify native/sqlcipher/matrix-manifest.json \
            --repo "$GITHUB_REPOSITORY"
          node scripts/verify-sqlcipher-native-assets.mjs \
            --root native/sqlcipher-node \
            --runtime node \
            --expected-build-commit "$GITHUB_SHA" \
            --expected-source-revision "$SQLCIPHER_SOURCE_REVISION" \
            --expected-runtime-version "$NODE_VERSION" \
            --require-matrix-manifest
          while IFS= read -r -d '' binding; do
            gh attestation verify "$binding" --repo "$GITHUB_REPOSITORY"
          done < <(find native/sqlcipher-node -type f -name better_sqlite3.node -print0)
          gh attestation verify native/sqlcipher-node/matrix-manifest.json \
            --repo "$GITHUB_REPOSITORY"

      - name: Release quality gates
        shell: bash
        run: |
          set -euo pipefail
          npm run doctor
          git diff --check
          npm run validate:integration-baseline
          npm run validate:boundaries
          npm run lint:ci
          npm run build --workspace=packages/core
          npm run typecheck --workspace=packages/server
          npm test --workspace=packages/server

      - name: Focused regression tests
        shell: bash
        run: |
          set -euo pipefail
          npm run test:scripts -- --run \
            scripts/tests/enterprise-oneclick-installer.test.js \
            scripts/tests/sqlcipher-native-assets.test.js \
            scripts/tests/verify-enterprise-package-signature.test.js \
            scripts/tests/sign-enterprise-package.test.js \
            scripts/tests/enterprise-candidate-workflow.test.js \
            scripts/tests/enterprise-runtime-dependencies.test.js

      - name: Build Linux enterprise package candidate
        run: npm run bundle:enterprise
        env:
          OTTO_LICENSE_PUBLIC_KEYS: ${{ secrets.OTTO_LICENSE_PUBLIC_KEYS }}
          OTTO_ALLOW_UNSIGNED_ENTERPRISE_PACKAGE: '1'
          OTTO_RELEASE_CHANNEL: stable

      - name: Verify candidate contents and checksum
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(deliverables/otto-enterprise-oneclick-v1.9.13-*.tar.gz)
          test "${#archives[@]}" -eq 1
          archive="${archives[0]}"
          checksum="${archive}.sha256"
          signature="${archive}.sig"
          test -f "$checksum"
          test ! -e "$signature"
          (cd deliverables && sha256sum -c "$(basename "$checksum")")
          mkdir candidate-unpack
          tar -xzf "$archive" -C candidate-unpack
          package_dir="$(find candidate-unpack -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$package_dir"
          test -x "$package_dir/install.sh"
          test -x "$package_dir/upgrade.sh"
          test -f "$package_dir/BUILD-INFO.json"
          test -f "$package_dir/release/manifest.json"
          node --input-type=module - \
            "$package_dir/release/manifest.json" \
            "$package_dir/BUILD-INFO.json" \
            "$GITHUB_SHA" <<'NODE'
          import { readFileSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          const buildInfo = JSON.parse(readFileSync(process.argv[3], 'utf8'));
          const expectedCommit = process.argv[4];
          if (manifest.version !== '1.9.13') throw new Error('manifest version mismatch');
          if (manifest.sourceCommit !== expectedCommit || buildInfo.sourceCommit !== expectedCommit) {
            throw new Error('manifest source identity mismatch');
          }
          if (manifest.buildCommit !== buildInfo.buildCommit) throw new Error('build identity mismatch');
          if (!Array.isArray(buildInfo.sourceStatus) ||
              buildInfo.sourceStatus.some((entry) => !/^\?\? native\/sqlcipher-node\//.test(entry))) {
            throw new Error('candidate contains unexpected source changes');
          }
          if (manifest.releaseChannel !== 'stable') throw new Error('manifest release channel mismatch');
          if (!Array.isArray(manifest.runtime?.supportedArchitectures) ||
              !manifest.runtime.supportedArchitectures.includes('linux-x64') ||
              !manifest.runtime.supportedArchitectures.includes('linux-arm64')) {
            throw new Error('manifest architecture matrix is incomplete');
          }
          if (manifest.database?.schemaTo !== 23 ||
              manifest.database?.encryption !== 'sqlcipher-required') {
            throw new Error('manifest database contract mismatch');
          }
          NODE
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"

      - name: Attest candidate archive
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ steps.candidate.outputs.archive }}

      - name: Upload candidate for isolated signing
        uses: actions/upload-artifact@v7
        with:
          name: otto-enterprise-v1.9.13-candidate
          path: |
            ${{ steps.candidate.outputs.archive }}
            ${{ steps.candidate.outputs.checksum }}
          if-no-files-found: error
          retention-days: 7
