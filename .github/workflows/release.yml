name: Release Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release. Empty means package.json version.'
        required: false
        type: string
      draft:
        description: 'Create or update a draft release.'
        required: false
        type: boolean
        default: true
      prerelease:
        description: 'Mark release as prerelease.'
        required: false
        type: boolean
        default: false
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22.13.0'
  RELEASES_REPO: ${{ github.repository }}
  OTTO_DESKTOP_MAX_INSTALLER_MB: '100'

jobs:
  build:
    name: Check, Build, Draft Release
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm install
        env:
          PYTHON: python3.11
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          INPUT_VERSION="${{ inputs.version }}"
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="${INPUT_VERSION#v}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="$(node -p "require('./package.json').version")"
          fi
          ROOT_VERSION="$(node -p "require('./package.json').version")"
          DESKTOP_VERSION="$(node -p "require('./packages/desktop/package.json').version")"
          if [ "$VERSION" != "$ROOT_VERSION" ] || [ "$VERSION" != "$DESKTOP_VERSION" ]; then
            echo "Version mismatch: target=$VERSION root=$ROOT_VERSION desktop=$DESKTOP_VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Repository anomaly checks
        run: |
          npm run doctor
          git diff --check

      - name: Focused regression tests
        run: |
          npx vitest run \
            packages/desktop/src/main/enterprise-client.test.ts \
            packages/desktop/scripts/packaging-contract.test.mjs \
            packages/server/src/server.test.ts \
            packages/server/src/enterprise/server.test.ts

      - name: Build desktop release artifacts
        run: node scripts/make-delivery-zip.mjs --build
        working-directory: packages/desktop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OTTO_RELEASES_REPO: ${{ env.RELEASES_REPO }}
          OTTO_DESKTOP_MAX_INSTALLER_MB: ${{ env.OTTO_DESKTOP_MAX_INSTALLER_MB }}

      - name: Build enterprise server package
        run: npm run bundle:enterprise

      - name: Verify release artifacts
        id: artifacts
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          DESKTOP_RELEASE="packages/desktop/release"
          ENTERPRISE_ARCHIVE="$(ls deliverables/otto-enterprise-oneclick-v${VERSION}-*.tar.gz | head -n 1)"
          ENTERPRISE_SHA="${ENTERPRISE_ARCHIVE}.sha256"
          test -f "$ENTERPRISE_ARCHIVE"
          test -f "$ENTERPRISE_SHA"
          sha256sum -c "$ENTERPRISE_SHA"
          for artifact in \
            "$DESKTOP_RELEASE/Otto-${VERSION}-arm64.dmg" \
            "$DESKTOP_RELEASE/Otto-${VERSION}-x64.dmg" \
            "$DESKTOP_RELEASE/Otto-Setup-${VERSION}-win-x64.exe"; do
            size="$(stat -f%z "$artifact")"
            limit="$((100 * 1024 * 1024))"
            if [ "$size" -gt "$limit" ]; then
              echo "Installer too large: $artifact ($size bytes)" >&2
              exit 1
            fi
          done
          {
            echo "files<<EOF"
            printf '%s\n' \
              "$DESKTOP_RELEASE/Otto-${VERSION}-arm64.dmg" \
              "$DESKTOP_RELEASE/Otto-${VERSION}-arm64.dmg.blockmap" \
              "$DESKTOP_RELEASE/Otto-${VERSION}-x64.dmg" \
              "$DESKTOP_RELEASE/Otto-${VERSION}-x64.dmg.blockmap" \
              "$DESKTOP_RELEASE/Otto-Setup-${VERSION}-win-x64.exe" \
              "$DESKTOP_RELEASE/Otto-Setup-${VERSION}-win-x64.exe.blockmap" \
              "$DESKTOP_RELEASE/latest.json" \
              "$ENTERPRISE_ARCHIVE" \
              "$ENTERPRISE_SHA"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.RELEASES_REPO }}
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.version.outputs.tag }}
          name: Otto v${{ steps.version.outputs.version }}
          draft: ${{ github.event_name != 'workflow_dispatch' || inputs.draft }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease }}
          files: ${{ steps.artifacts.outputs.files }}
          generate_release_notes: true

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: otto-release-v${{ steps.version.outputs.version }}
          path: |
            packages/desktop/release/*
            deliverables/otto-enterprise-oneclick-v${{ steps.version.outputs.version }}-*.tar.gz
            deliverables/otto-enterprise-oneclick-v${{ steps.version.outputs.version }}-*.tar.gz.sha256
          retention-days: 30
