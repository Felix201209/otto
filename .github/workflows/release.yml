name: Release Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release. Empty means package.json version.'
        required: false
        type: string
      draft:
        description: 'Create or update a draft release.'
        required: false
        type: boolean
        default: true
      prerelease:
        description: 'Mark release as prerelease.'
        required: false
        type: boolean
        default: false
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22.13.0'
  RELEASES_REPO: Felix201209/otto-releases
  OTTO_DESKTOP_MAX_INSTALLER_MB: '160'

jobs:
  build:
    name: Check, Build, Draft Release
    runs-on: macos-latest
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm install
        env:
          PYTHON: python3.11
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          INPUT_VERSION="${{ inputs.version }}"
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="${INPUT_VERSION#v}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="$(node -p "require('./package.json').version")"
          fi
          ROOT_VERSION="$(node -p "require('./package.json').version")"
          DESKTOP_VERSION="$(node -p "require('./packages/desktop/package.json').version")"
          if [ "$VERSION" != "$ROOT_VERSION" ] || [ "$VERSION" != "$DESKTOP_VERSION" ]; then
            echo "Version mismatch: target=$VERSION root=$ROOT_VERSION desktop=$DESKTOP_VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Repository anomaly checks
        run: |
          npm run doctor
          git diff --check

      - name: Focused regression tests
        run: |
          npx vitest run \
            packages/desktop/src/main/enterprise-client.test.ts \
            packages/desktop/scripts/packaging-contract.test.mjs \
            packages/server/src/server.test.ts \
            packages/server/src/enterprise/server.test.ts

      - name: Build desktop release artifacts
        run: node scripts/make-delivery-zip.mjs --build
        working-directory: packages/desktop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OTTO_RELEASES_REPO: ${{ env.RELEASES_REPO }}
          OTTO_DESKTOP_MAX_INSTALLER_MB: ${{ env.OTTO_DESKTOP_MAX_INSTALLER_MB }}

      - name: Build enterprise server package
        run: npm run bundle:enterprise

      - name: Verify release artifacts
        id: artifacts
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          DESKTOP_RELEASE="packages/desktop/release"
          ENTERPRISE_ARCHIVE="$(ls deliverables/otto-enterprise-oneclick-v${VERSION}-*.tar.gz | head -n 1)"
          ENTERPRISE_SHA="${ENTERPRISE_ARCHIVE}.sha256"
          test -f "$ENTERPRISE_ARCHIVE"
          test -f "$ENTERPRISE_SHA"
          sha256sum -c "$ENTERPRISE_SHA"
          for artifact in \
            "$DESKTOP_RELEASE/Otto-${VERSION}-arm64.dmg" \
            "$DESKTOP_RELEASE/Otto-${VERSION}-x64.dmg" \
            "$DESKTOP_RELEASE/Otto-Setup-${VERSION}-win-x64.exe"; do
            size="$(stat -f%z "$artifact")"
            limit="$((160 * 1024 * 1024))"
            if [ "$size" -gt "$limit" ]; then
              echo "Installer too large: $artifact ($size bytes)" >&2
              exit 1
            fi
          done
          {
            echo "files<<EOF"
            printf '%s\n' \
              "$DESKTOP_RELEASE/Otto-${VERSION}-arm64.dmg" \
              "$DESKTOP_RELEASE/Otto-${VERSION}-arm64.dmg.blockmap" \
              "$DESKTOP_RELEASE/Otto-${VERSION}-x64.dmg" \
              "$DESKTOP_RELEASE/Otto-${VERSION}-x64.dmg.blockmap" \
              "$DESKTOP_RELEASE/Otto-Setup-${VERSION}-win-x64.exe" \
              "$DESKTOP_RELEASE/Otto-Setup-${VERSION}-win-x64.exe.blockmap" \
              "$DESKTOP_RELEASE/latest.json" \
              "$ENTERPRISE_ARCHIVE" \
              "$ENTERPRISE_SHA"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.RELEASES_REPO }}
          token: ${{ secrets.OTTO_RELEASES_TOKEN || secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.version.outputs.tag }}
          name: Otto v${{ steps.version.outputs.version }}
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease }}
          files: ${{ steps.artifacts.outputs.files }}
          generate_release_notes: true

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: otto-release-v${{ steps.version.outputs.version }}
          path: |
            packages/desktop/release/*
            deliverables/otto-enterprise-oneclick-v${{ steps.version.outputs.version }}-*.tar.gz
            deliverables/otto-enterprise-oneclick-v${{ steps.version.outputs.version }}-*.tar.gz.sha256
          retention-days: 30

  deploy-enterprise:
    name: Deploy Enterprise Server
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      ${{
        success()
        && (
          github.event_name == 'push'
          || (github.event_name == 'workflow_dispatch' && !inputs.draft)
        )
      }}
    env:
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      DEPLOY_CONFIG_PATH: ${{ secrets.DEPLOY_CONFIG_PATH || '/etc/otto-enterprise/enterprise.env' }}

    steps:
      - name: Validate deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${{ secrets.DEPLOY_HOST }}"
          test -n "${{ secrets.DEPLOY_USER }}"
          test -n "${{ secrets.DEPLOY_SSH_KEY }}"

      - name: Download release workflow artifact
        uses: actions/download-artifact@v4
        with:
          name: otto-release-v${{ needs.build.outputs.version }}
          path: release-download

      - name: Verify enterprise package
        shell: bash
        run: |
          set -euo pipefail
          cd release-download
          sha256sum -c otto-enterprise-oneclick-v${{ needs.build.outputs.version }}-*.tar.gz.sha256
          ls -lh otto-enterprise-oneclick-v${{ needs.build.outputs.version }}-*.tar.gz*

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${DEPLOY_PORT}" "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload enterprise package
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_DIR="/var/tmp/otto-enterprise-github/${{ needs.build.outputs.tag }}-${GITHUB_RUN_ID}"
          echo "REMOTE_DIR=$REMOTE_DIR" >> "$GITHUB_ENV"
          ssh -i ~/.ssh/id_deploy -p "${DEPLOY_PORT}" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "mkdir -p '$REMOTE_DIR'"
          scp -i ~/.ssh/id_deploy -P "${DEPLOY_PORT}" release-download/otto-enterprise-oneclick-v${{ needs.build.outputs.version }}-* \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:$REMOTE_DIR/"

      - name: Install or upgrade on server
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy -p "${DEPLOY_PORT}" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "set -euo pipefail
             cd '$REMOTE_DIR'
             sha256sum -c ./*.sha256
             ARCHIVE=\$(ls otto-enterprise-oneclick-v${{ needs.build.outputs.version }}-*.tar.gz | head -n 1)
             rm -rf unpack
             mkdir unpack
             tar -xzf \"\$ARCHIVE\" -C unpack
             PKG_DIR=\$(find unpack -mindepth 1 -maxdepth 1 -type d | head -n 1)
             if [ -L /opt/otto-enterprise/current ]; then
               sudo \"\$PKG_DIR/upgrade.sh\" --config '${DEPLOY_CONFIG_PATH}'
             else
               sudo \"\$PKG_DIR/install.sh\" --config '${DEPLOY_CONFIG_PATH}'
             fi"
