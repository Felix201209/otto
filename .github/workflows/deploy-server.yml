name: Deploy Enterprise Server

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy, for example 1.9.3 or v1.9.3.'
        required: true
        type: string
      dry_run:
        description: 'Run remote dry-run only.'
        required: false
        type: boolean
        default: true
      apply_confirmation:
        description: 'Production apply requires exactly DEPLOY_V1.9.13.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-enterprise
  cancel-in-progress: false

env:
  RELEASES_REPO: Felix201209/otto-releases
  DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
  DEPLOY_CONFIG_PATH: ${{ secrets.DEPLOY_CONFIG_PATH || '/etc/otto-enterprise/enterprise.env' }}

jobs:
  deploy:
    name: Sync and Upgrade Server
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.version }}"
          TAG="${TAG#v}"
          test "$TAG" = '1.9.13'
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "tag=v$TAG" >> "$GITHUB_OUTPUT"

      - name: Fail closed unless production apply is explicit
        shell: bash
        env:
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
          APPLY_CONFIRMATION: ${{ inputs.apply_confirmation }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN_INPUT" != "true" ] \
            && [ "$APPLY_CONFIRMATION" != 'DEPLOY_V1.9.13' ]; then
            echo 'refusing production apply without exact confirmation' >&2
            exit 3
          fi

      - name: Validate deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${{ secrets.DEPLOY_HOST }}"
          test -n "${{ secrets.DEPLOY_USER }}"
          test -n "${{ secrets.DEPLOY_SSH_KEY }}"
          test -n "${{ secrets.DEPLOY_KNOWN_HOSTS }}"
          test -n "${{ secrets.DEPLOY_SUDO_PASSWORD }}"
          test -n "${{ secrets.OTTO_ENTERPRISE_SIGNING_PUBLIC_KEY }}"

      - name: Download enterprise release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-download
          gh release download "${{ steps.version.outputs.tag }}" \
            --repo "${RELEASES_REPO}" \
            --pattern "otto-enterprise-oneclick-v${{ steps.version.outputs.version }}-*.tar.gz" \
            --pattern "otto-enterprise-oneclick-v${{ steps.version.outputs.version }}-*.tar.gz.sha256" \
            --pattern "otto-enterprise-oneclick-v${{ steps.version.outputs.version }}-*.tar.gz.sig" \
            --dir release-download
          cd release-download
          sha256sum -c ./*.sha256
          ARCHIVE="$(find . -type f -name 'otto-enterprise-oneclick-v${{ steps.version.outputs.version }}-*.tar.gz' -print -quit)"
          SIGNATURE="${ARCHIVE}.sig"
          test -n "$ARCHIVE"
          test -f "$SIGNATURE"
          OTTO_ENTERPRISE_SIGNING_PUBLIC_KEY="${{ secrets.OTTO_ENTERPRISE_SIGNING_PUBLIC_KEY }}" \
            node ../scripts/verify-enterprise-package-signature.mjs "$ARCHIVE" "$SIGNATURE"
          ls -lh

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload enterprise package
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_DIR="/var/tmp/otto-enterprise-github/${{ steps.version.outputs.tag }}-${GITHUB_RUN_ID}"
          echo "REMOTE_DIR=$REMOTE_DIR" >> "$GITHUB_ENV"
          ssh -i ~/.ssh/id_deploy -p "${DEPLOY_PORT}" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "mkdir -p '$REMOTE_DIR'"
          scp -i ~/.ssh/id_deploy -P "${DEPLOY_PORT}" release-download/* \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:$REMOTE_DIR/"

      - name: Install or upgrade on server
        shell: bash
        env:
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
          DEPLOY_SUDO_PASSWORD: ${{ secrets.DEPLOY_SUDO_PASSWORD }}
        run: |
          set -euo pipefail
          DRY_RUN_FLAG=""
          if [ "$DRY_RUN_INPUT" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          ssh -i ~/.ssh/id_deploy -p "${DEPLOY_PORT}" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "set -euo pipefail
             cd '$REMOTE_DIR'
             sha256sum -c ./*.sha256
             ARCHIVE=\$(ls otto-enterprise-oneclick-v${{ steps.version.outputs.version }}-*.tar.gz | head -n 1)
             rm -rf unpack
             mkdir unpack
             tar -xzf \"\$ARCHIVE\" -C unpack
             PKG_DIR=\$(find unpack -mindepth 1 -maxdepth 1 -type d | head -n 1)
             test -n \"\$PKG_DIR\"
             test -L /opt/otto-enterprise/current"
          if [ "$DRY_RUN_INPUT" != "true" ]; then
            printf '%s\n' "$DEPLOY_SUDO_PASSWORD" | \
            ssh -i ~/.ssh/id_deploy -p "${DEPLOY_PORT}" \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
              "set -euo pipefail
               cd '$REMOTE_DIR'
               PKG_DIR=\$(find unpack -mindepth 1 -maxdepth 1 -type d | head -n 1)
               test -n \"\$PKG_DIR\"
               sudo -k -S -p '' \"\$PKG_DIR/backup-now.sh\" '${DEPLOY_CONFIG_PATH}'"
          fi
          printf '%s\n' "$DEPLOY_SUDO_PASSWORD" | \
          ssh -i ~/.ssh/id_deploy -p "${DEPLOY_PORT}" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "set -euo pipefail
             cd '$REMOTE_DIR'
             PKG_DIR=\$(find unpack -mindepth 1 -maxdepth 1 -type d | head -n 1)
             test -n \"\$PKG_DIR\"
             sudo -k -S -p '' \"\$PKG_DIR/upgrade.sh\" --config '${DEPLOY_CONFIG_PATH}' $DRY_RUN_FLAG"

      - name: Verify production version and public contracts
        if: ${{ inputs.dry_run == false }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy -p "${DEPLOY_PORT}" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "set -euo pipefail
             CURRENT=\$(readlink -f /opt/otto-enterprise/current)
             case \"\$CURRENT\" in
               /opt/otto-enterprise/releases/1.9.13-*) ;;
               *) echo \"unexpected current release: \$CURRENT\" >&2; exit 5 ;;
             esac
             curl --fail --silent --show-error --retry 5 \
               http://127.0.0.1:7778/enterprise/health > /tmp/otto-health-${GITHUB_RUN_ID}.json
             curl --fail --silent --show-error --retry 5 \
               http://127.0.0.1:7778/enterprise/legal > /tmp/otto-legal-${GITHUB_RUN_ID}.json
             /opt/otto-enterprise/runtime/current/bin/node -e '
               const fs = require(\"node:fs\");
               const health = JSON.parse(fs.readFileSync(process.argv[1], \"utf8\"));
               const legal = JSON.parse(fs.readFileSync(process.argv[2], \"utf8\"));
               if (health.status !== \"ok\" || health.version !== \"1.9.13\") {
                 throw new Error(\"health identity mismatch\");
               }
               const documents = Array.isArray(legal) ? legal : legal.documents;
               if (!Array.isArray(documents) || documents.length < 2) {
                 throw new Error(\"legal documents missing\");
               }
               for (const document of documents) {
                 if (!/^[0-9a-f]{64}$/.test(document.sha256 || \"\")) {
                   throw new Error(\"legal document hash invalid\");
                 }
               }
               console.log(JSON.stringify({
                 status: health.status,
                 version: health.version,
                 apiVersion: health.apiVersion,
                 legalDocuments: documents.map(({ id, version }) => ({ id, version })),
               }));
             ' /tmp/otto-health-${GITHUB_RUN_ID}.json /tmp/otto-legal-${GITHUB_RUN_ID}.json"
