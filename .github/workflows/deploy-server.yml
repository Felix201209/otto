name: Deploy Enterprise Server

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Only v1.9.11 is accepted by this audited hotfix branch.'
        required: true
        type: string
      dry_run:
        description: 'Validate without switching the production release.'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploy-enterprise
  cancel-in-progress: false

env:
  DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}

jobs:
  deploy:
    name: Hotfix Registration Legal Documents
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout audited hotfix
        uses: actions/checkout@v4

      - name: Validate request and deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          test "$VERSION" = '1.9.11'
          test "${{ github.ref_name }}" = 'hotfix/registration-legal-docs-20260827'
          test -n "${{ secrets.DEPLOY_HOST }}"
          test -n "${{ secrets.DEPLOY_USER }}"
          test -n "${{ secrets.DEPLOY_SSH_KEY }}"
          test -n "${{ secrets.DEPLOY_KNOWN_HOSTS }}"
          test -n "${{ secrets.DEPLOY_SUDO_PASSWORD }}"
          bash -n scripts/production-registration-legal-hotfix.sh

      - name: Configure pinned SSH host and key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload hotfix script
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_DIR="/var/tmp/otto-registration-legal-hotfix-${GITHUB_RUN_ID}"
          echo "REMOTE_DIR=$REMOTE_DIR" >> "$GITHUB_ENV"
          ssh -i ~/.ssh/id_deploy -p "${DEPLOY_PORT}" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "mkdir -p '$REMOTE_DIR'"
          scp -i ~/.ssh/id_deploy -P "${DEPLOY_PORT}" \
            scripts/production-registration-legal-hotfix.sh \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:$REMOTE_DIR/"

      - name: Validate or apply hotfix
        shell: bash
        env:
          DEPLOY_SUDO_PASSWORD: ${{ secrets.DEPLOY_SUDO_PASSWORD }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          MODE=apply
          if [ "$DRY_RUN_INPUT" = true ]; then MODE=dry-run; fi
          printf '%s\n' "$DEPLOY_SUDO_PASSWORD" | \
            ssh -i ~/.ssh/id_deploy -p "${DEPLOY_PORT}" \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
              "sudo -S -p '' bash '$REMOTE_DIR/production-registration-legal-hotfix.sh' '$GITHUB_RUN_ID' '$MODE'"

      - name: Clean remote staging directory
        if: always()
        shell: bash
        run: |
          ssh -i ~/.ssh/id_deploy -p "${DEPLOY_PORT}" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "rm -rf '$REMOTE_DIR'"
