[package]
name = "otto-native"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "otto-native"
path = "src/main.rs"

[dependencies]
sled = "0.34"
aes-gcm = "0.10"
tiktoken-rs = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
lru = "0.12"
parking_lot = "0.12"
rand = "0.8"
hex = "0.4"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
