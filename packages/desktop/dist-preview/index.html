<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Otto</title>
    <style>
      /*
       * webview 全套 CSS 依赖 --vscode-* 变量（themeUtils 读 --vscode-editor-background
       * 判明暗）。Electron 无 VSCode 主题注入 → 移植 webview 前必须自带一套 --vscode-*
       * 变量（交付文档 [WEBVIEW] §5.5）。这里给一组暗色默认值兜底；
       * Issue #5/#7 接入主题切换时再补亮色组。
       */
      :root {
        --vscode-editor-background: #181818;
        --vscode-editor-foreground: #cccccc;
        --vscode-foreground: #cccccc;
        --vscode-descriptionForeground: #9d9d9d;
        --vscode-panel-border: #2b2b2b;
        --vscode-button-background: #6f6f73;
        --vscode-button-foreground: #ffffff;
        --vscode-button-hoverBackground: #8a8a8e;
        --vscode-input-background: #1e1e1e;
        --vscode-input-foreground: #cccccc;
        --vscode-input-border: #3c3c3c;
        --vscode-focusBorder: #8a8a8e;
        --vscode-list-hoverBackground: #2a2d2e;
        --vscode-list-activeSelectionBackground: #4b4b4f;
        --vscode-textLink-foreground: #8a8a8e;
      }

      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        padding: 0;
      }

      body {
        background: var(--vscode-editor-background);
        color: var(--vscode-editor-foreground);
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <link rel="stylesheet" href="./main.css" />
  <script src="./main.js"></script>
  </body>
</html>
